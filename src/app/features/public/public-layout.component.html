<div class="public-shell">
  <header class="site-header">
    <div class="site-header__inner">
      <a routerLink="/" class="site-header__brand">
        <span class="site-header__logo">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M22 11v1a10 10 0 1 1-9-10" />
            <path d="M8 14s1.5 2 4 2 4-2 4-2" />
            <line x1="9" x2="9.01" y1="9" y2="9" />
            <line x1="15" x2="15.01" y1="9" y2="9" />
            <path d="M16 5h6" />
            <path d="M19 2v6" />
          </svg>
        </span>
        <span class="site-header__name">DentalCare</span>
      </a>

      <nav class="site-header__nav">
        <a
          routerLink="/"
          routerLinkActive="site-header__link--active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="site-header__link"
        >
          Inicio
        </a>
        <a
          routerLink="/reservar"
          routerLinkActive="site-header__link--active"
          class="site-header__link"
        >
          Reservar turno
        </a>
      </nav>

      <div class="site-header__actions">
        <a [routerLink]="adminRoute" class="btn-ghost-sm">Panel admin</a>
        <a routerLink="/reservar" class="btn-primary-sm">Sacar turno</a>
      </div>
    </div>
  </header>

  <main class="public-main">
    <router-outlet />
  </main>
</div>
