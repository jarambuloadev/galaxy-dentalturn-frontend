<app-page-header title="Pacientes" description="Directorio de pacientes registrados y datos de contacto del consultorio">
  <button *appHasRole="'admin'" mat-raised-button color="primary" routerLink="/patients/new">
    <mat-icon>add</mat-icon> Nuevo paciente
  </button>
</app-page-header>

<mat-card>
  <mat-card-content>
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Buscar paciente</mat-label>
      <mat-icon matPrefix>search</mat-icon>
      <input
        matInput
        [formControl]="searchControl"
        placeholder="Nombre, correo o teléfono..."
        aria-label="Buscar paciente"
        aria-live="polite"
      />
    </mat-form-field>

    @if (loading()) {
      <div class="table-skeleton">
        @for (i of [1, 2, 3, 4, 5]; track i) {
          <div class="skeleton-row"></div>
        }
      </div>
    } @else if (dataSource.data.length === 0) {
      <app-empty-state
        icon="groups"
        title="No se encontraron pacientes"
        message="No hay pacientes registrados que coincidan con la búsqueda."
      ></app-empty-state>
    } @else {
      <div class="table-container">
        <table mat-table [dataSource]="dataSource" aria-label="Listado de pacientes">
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>ID</th>
            <td mat-cell *matCellDef="let p">
              <span class="id-badge">#{{ p.id }}</span>
            </td>
          </ng-container>

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Paciente</th>
            <td mat-cell *matCellDef="let p" class="name-cell">{{ p.name }}</td>
          </ng-container>

          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Correo electrónico</th>
            <td mat-cell *matCellDef="let p" class="email-cell">{{ p.email }}</td>
          </ng-container>

          <ng-container matColumnDef="phone">
            <th mat-header-cell *matHeaderCellDef>Teléfono</th>
            <td mat-cell *matCellDef="let p">
              <span class="phone-pill">
                <mat-icon class="phone-pill__icon">call</mat-icon>
                {{ p.phone }}
              </span>
            </td>
          </ng-container>

          <ng-container matColumnDef="active">
            <th mat-header-cell *matHeaderCellDef>Estado</th>
            <td mat-cell *matCellDef="let p">
              @if (p.active) {
                <span class="status-pill status-pill--active">Activo</span>
              } @else {
                <span class="status-pill status-pill--inactive">Inactivo</span>
              }
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let p">
              <div class="action-buttons">
                <button
                  mat-icon-button
                  class="action-btn action-btn--view"
                  matTooltip="Ver detalle"
                  [routerLink]="['/patients', p.id]"
                  aria-label="Ver detalle del paciente"
                >
                  <mat-icon>visibility</mat-icon>
                </button>
                <button
                  *appHasRole="'admin'"
                  mat-icon-button
                  class="action-btn action-btn--edit"
                  matTooltip="Editar"
                  aria-label="Editar paciente"
                  (click)="editPatient(p.id)"
                >
                  <mat-icon>edit</mat-icon>
                </button>
                <button
                  *appHasRole="'admin'"
                  mat-icon-button
                  class="action-btn action-btn--delete"
                  matTooltip="Eliminar"
                  (click)="confirmDelete(p)"
                  aria-label="Eliminar paciente"
                >
                  <mat-icon>delete</mat-icon>
                </button>
              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>

      <mat-paginator
        [length]="totalItems"
        [pageSize]="pageSize"
        [pageIndex]="pageIndex"
        [pageSizeOptions]="[5, 10, 25]"
        (page)="onPageChange($event)"
        aria-label="Paginación de pacientes"
      />
    }
  </mat-card-content>
</mat-card>
