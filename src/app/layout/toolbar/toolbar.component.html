<header class="admin-header">
  <div class="admin-header__inner">
    <div class="admin-header__left">
      <button
        type="button"
        class="admin-header__toggle"
        aria-label="Alternar menú de navegación"
        title="Ocultar / mostrar menú"
        (click)="toggleMenu()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect width="18" height="18" x="3" y="3" rx="2" />
          <path d="M9 3v18" />
        </svg>
      </button>

      <div class="admin-header__brand">
        <span class="admin-header__badge" aria-hidden="true">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M22 11v1a10 10 0 1 1-9-10" />
            <path d="M8 14s1.5 2 4 2 4-2 4-2" />
            <line x1="9" x2="9.01" y1="9" y2="9" />
            <line x1="15" x2="15.01" y1="9" y2="9" />
            <path d="M16 5h6" />
            <path d="M19 2v6" />
          </svg>
        </span>
        <span class="admin-header__title">
          DentalCare <span class="admin-header__subtitle">· Admin</span>
        </span>
      </div>
    </div>

    <div class="admin-header__right">
      @if (auth.currentUser()?.email) {
        <span
          class="admin-header__user"
          [matMenuTriggerFor]="userMenu"
          role="button"
          tabindex="0"
          aria-label="Abrir menú de usuario"
        >
          {{ auth.currentUser()?.email }}
        </span>
      }
      <button type="button" class="admin-header__logout-btn" (click)="logout()">
        Cerrar sesión
      </button>

      <mat-menu #userMenu="matMenu">
        <div class="user-menu-header" mat-menu-item disabled>
          <span>Rol: {{ auth.currentUser()?.role }}</span>
        </div>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Cerrar sesión</span>
        </button>
      </mat-menu>
    </div>
  </div>
</header>
